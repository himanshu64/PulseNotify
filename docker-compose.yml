services:
  db:
    image: postgres:16-alpine
    container_name: pulsenotify-db
    environment:
      POSTGRES_DB: pulsenotify
      POSTGRES_USER: pulsenotify
      POSTGRES_PASSWORD: pulsenotify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsenotify -d pulsenotify"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pulsenotify-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
