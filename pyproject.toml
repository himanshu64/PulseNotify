[project]
name = "pulsenotify"
version = "0.1.0"
description = "Flight price monitoring service with async Celery workers and scheduled price checks"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "django>=6.1.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "redis<6.5",
    "requests>=2.34.2",
]

[project.scripts]
manage = "django.core.management:execute_from_command_line"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
